name: Faktury TXT – Windows .exe

on:
  workflow_dispatch:
  push:
    paths:
      - "faktury_txt/**"
      - ".github/workflows/faktury-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r faktury_txt/requirements.txt pyinstaller
      - run: python -m unittest tests.test_invoice_parser -v
      - run: pyinstaller --onefile --windowed --name FakturyTXT --paths faktury_txt faktury_txt/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: FakturyTXT-windows
          path: dist/FakturyTXT.exe
