<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prime AI Search – demo</title>
<style>
  body{font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f4f5f7;color:#222}
  header{background:#1d2733;color:#fff;padding:20px 16px}
  main{max-width:720px;margin:40px auto;padding:0 16px}
  form{display:flex;gap:8px}
  input{flex:1;padding:12px 14px;font-size:16px;border:1px solid #ccc;border-radius:8px}
  button{padding:12px 18px;border:0;border-radius:8px;background:#f39200;color:#fff;font-weight:600}
  ul{color:#555}
</style>
</head>
<body>
<header><strong>Prime AI Search</strong> – testovacia stránka</header>
<main>
  <form onsubmit="return false">
    <input name="q" type="search" placeholder="Hľadať… napr. topánky s oceľovou špičkou do 40 €">
    <button>Hľadať</button>
  </form>
  <p>Píšte – výsledky sa ukazujú okamžite. <b>Enter</b> alebo „✨ Opýtať sa AI“ spustí AI vyhľadávanie.</p>
  <ul>
    <li>zimné rukavice na prácu vonku</li>
    <li>topánky s oceľovou špičkou do 40 €</li>
    <li>niečo reflexné pre cestárov</li>
    <li>oblečenie pre kuchára</li>
  </ul>
</main>
<script src="/widget.js" defer data-lang="sk" data-api=""></script>
</body>
</html>
